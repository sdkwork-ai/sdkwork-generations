[workspace]
resolver = "2"
members = [
    "crates/sdkwork-generations-database-host",
    "crates/sdkwork-generations-mcp-service",
    "crates/sdkwork-generations-provider-adapter",
    "crates/sdkwork-intelligence-generations-service",
    "crates/sdkwork-routes-generations-http-shared",
    "crates/sdkwork-routes-generations-app-api",
    "crates/sdkwork-routes-generations-backend-api",
    "crates/sdkwork-api-generations-assembly",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
http = "1"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dotenvy = "0.15"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "time"] }
time = { version = "0.3", features = ["parsing"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
base64 = "0.22"

# Platform frameworks
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-iam-database-host = { path = "../sdkwork-iam/crates/sdkwork-iam-database-host" }
sdkwork-iam-embedded-application-bootstrap = { path = "../sdkwork-iam/crates/sdkwork-iam-embedded-application-bootstrap" }

# Database
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-drift = { path = "../sdkwork-database/crates/sdkwork-database-drift" }
sdkwork-database-repository = { path = "../sdkwork-database/crates/sdkwork-database-repository" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id" }

# Assets (for auto-save integration)
sdkwork-api-assets-assembly = { path = "../sdkwork-assets/crates/sdkwork-api-assets-assembly" }
sdkwork-api-drive-assembly = { path = "../sdkwork-drive/crates/sdkwork-api-drive-assembly" }
sdkwork-routes-drive-app-api = { path = "../sdkwork-drive/crates/sdkwork-routes-drive-app-api" }

# Local crate dependencies
sdkwork-generations-database-host = { path = "crates/sdkwork-generations-database-host" }
sdkwork-generations-provider-adapter = { path = "crates/sdkwork-generations-provider-adapter" }
sdkwork-generations-mcp-service = { path = "crates/sdkwork-generations-mcp-service" }
sdkwork-intelligence-generations-service = { path = "crates/sdkwork-intelligence-generations-service", features = ["http-axum", "postgres-sync"] }
sdkwork-routes-generations-http-shared = { path = "crates/sdkwork-routes-generations-http-shared" }
sdkwork-routes-generations-app-api = { path = "crates/sdkwork-routes-generations-app-api" }
sdkwork-routes-generations-backend-api = { path = "crates/sdkwork-routes-generations-backend-api" }
sdkwork-api-generations-assembly = { path = "crates/sdkwork-api-generations-assembly" }

# Kernel (RIG agent MCP provider contract)
sdkwork-agent-kernel = { path = "../sdkwork-kernel/sdkwork-agent-kernel" }

# Cloudrouter generated Rust SDK (media gateway vendor calls)
cloudrouter-open-sdk = { path = "../sdkwork-cloudrouter/sdks/cloudrouter-open-sdk/cloudrouter-open-sdk-rust/generated/server-openapi" }
