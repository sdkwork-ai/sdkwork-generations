# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/generations/webserver.pid;
error_log /var/log/sdkwork/generations/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name generations-staging.sdkwork.com generations-staging.birdcoder.com generations-staging.dtupay.com generations-staging.sdkwork.cn generations-staging.birdcoder.cn generations-staging.dtupay.cn generations-staging.skubc.com generations-staging.skubc.cn generations-staging.zowalk.com generations-staging.zowalk.cn generations-staging.offer86.com generations-staging.offer86.cn generations-staging.86offer.com generations-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
