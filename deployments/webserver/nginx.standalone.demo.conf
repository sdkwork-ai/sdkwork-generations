# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/generations/webserver.pid;
error_log /var/log/sdkwork/generations/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18093;
    }
    server {
        listen 80;
        server_name generations-demo.sdkwork.com generations-demo.birdcoder.com generations-demo.dtupay.com generations-demo.noaper.com generations-demo.sdkwork.cn generations-demo.birdcoder.cn generations-demo.dtupay.cn generations-demo.noaper.cn generations-demo.skubc.com generations-demo.skubc.cn generations-demo.zowalk.com generations-demo.zowalk.cn generations-demo.offer86.com generations-demo.offer86.cn generations-demo.86offer.com generations-demo.86offer.cn;
        include snippets/adaptive-web.named-locations.conf;
        include snippets/gateway-api-locations.nonproduction.conf;
        location / {
            include snippets/adaptive-web.dispatch.conf;
        }
    }
}
