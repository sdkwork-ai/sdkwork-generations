# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/generations/webserver.pid;
error_log /var/log/sdkwork/generations/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:18093;
    }
    server {
        listen 80;
        server_name generations-dev.sdkwork.com generations-dev.birdcoder.com generations-dev.dtupay.com generations-dev.sdkwork.cn generations-dev.birdcoder.cn generations-dev.dtupay.cn generations-dev.skubc.com generations-dev.skubc.cn generations-dev.zowalk.com generations-dev.zowalk.cn generations-dev.offer86.com generations-dev.offer86.cn generations-dev.86offer.com generations-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
